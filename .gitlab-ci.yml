# ==============================================================================
# Environment setup
# ==============================================================================
image: server-harbor:80/dls2/dls2-dev:22.04
before_script:
  - source /root/dls_gitlab_ci/gitlab-script.sh
    
# ==============================================================================
# Stages
# ==============================================================================
stages:
  - build
  - test
  - coverage
  - coverage-badge
  - package
  - deploy

# ------------------------------------------------------------------------------
# Build Stage
# ------------------------------------------------------------------------------
build:
  stage: build
  tags:
    - dls
  script:
    - mkdir build
    - cd build
    # Enable gcov/lcov from command line
    - cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS:STRING="-fprofile-arcs -ftest-coverage" ..
    - make -j$(nproc) install
    - fgrep -R "CMAKE_BUILD_TYPE"
    # Make robots libraries visible for test stage
    - cp /usr/lib/robots/* tests/
  artifacts:
    paths:
      - build/*
      - build/tests/*
    expire_in: 3 hrs


test:
  stage: test
  tags: 
    - dls
  script:
    - echo "Test stage started"
    - cd build
    - make check
  artifacts:
    paths:
      - build/tests/CMakeFiles/*
    expire_in: 30 mins
  dependencies:
    - build

# Generate code coverage data and html output for visualizing them
# The build and test stages generate the ".gcno" and ".gcda" files used by GCOV
coverage:
  stage: coverage
  tags:
    - dls
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends lcov
  script:
    - echo "Coverage (lines) stage started"
    - cd build/tests/CMakeFiles && mkdir gcov_tests
    - for file in *.dir/*/* ; do cp "$file" gcov_tests ; done
    - cd gcov_tests && ls
    - lcov --capture --directory . --output-file coverage.info
    - genhtml coverage.info --output-directory out
  artifacts:
    paths:
      - build/tests/CMakeFiles/gcov_tests/*
    expire_in: 1 hrs
  dependencies:
    - test

# Update the test coverage GitLab badge with lines coverage value
coverage-lines:
  stage: coverage-badge
  tags:
    - dls
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends lcov
  script:
    - echo "Coverage (lines) stage started"
    - cd build/tests/CMakeFiles/gcov_tests
    - genhtml coverage.info --output-directory out
  coverage: '/lines.*?(\d+.*(?:\d+)*)[$%]/'
  dependencies:
    - coverage

# Update the test coverage GitLab badge with functions coverage value
coverage-functions:
  stage: coverage-badge
  tags:
    - dls
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends lcov
  script:
    - echo "Coverage (functions) stage started"
    - cd build/tests/CMakeFiles/gcov_tests
    - genhtml coverage.info --output-directory out
  coverage: '/functions.*?(\d+.*(?:\d+)*)[$%]/'
  dependencies:
    - coverage

# Create Robotlib debian
package:
  stage: package
  tags:
    - dls
  script:
    - cd build
    - make package
    - echo $CI_JOB_ID > CI_JOB_ID   
  artifacts:
    paths:
      - build/*.deb
      - build/CI_JOB_ID
    expire_in: 3 hrs
  dependencies:
    - build
    - test
  only:
    - master

deploy:
  stage: deploy
  tags:
    - dls
  script:
    - curl http://server-ubuntu18/scripts/make-json.bash --output make-json.bash
    - source make-json.bash token=$DLSUSER_TOKEN project=$CI_PROJECT_ID branch=$CI_COMMIT_BRANCH job=$(cat build/CI_JOB_ID) tag=latest release=$(lsb_release -cs) > out.json
    - 'curl -X post -H "Content-Type: application/json" -d @out.json http://server-ubuntu18:9000/hooks/deploy-apt'
  dependencies:
    - package
  only:
    - master
