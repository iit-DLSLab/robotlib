image: server-harbor:80/ant/ant_iit:devel

stages:
   - build
   - test

build:
  stage: build
  tags:
    - ant-devel
  script:
    - mkdir build
    - cd build
    - cmake ..
    - make -j$(nproc)
  artifacts:
    paths:
      - build/*
      - bin/*
    expire_in: 3 hrs

test:
  stage: test
  tags: 
    - ant-devel
  script:
    - cd build
    - cmake .. -DBUILD_TESTING=On
    - make -j$(nproc)
    - make check