# ==============================================================================
# Environment setup
# ==============================================================================
image: server-harbor:80/dls2/dls2-dev:22.04
    
# ==============================================================================
# Stages
# ==============================================================================
stages:
  - build
  # - test
  # - coverage
  # - coverage-badge
  - packdeploy 

# ------------------------------------------------------------------------------
# Build Stage
# ------------------------------------------------------------------------------
# Print versions of installed programmes on the docker image. This is helpful
# for a quick sanity check when things break
display:versions:
  stage: build
  tags:
    - dls2
  script:
    - cmake --version
    - gcc --version
    - g++ --version
    
build:
  stage: build
  tags:
    - dls2
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan gitlab.advr.iit.it >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
    - git clone git@gitlab.advr.iit.it:dls-lab/dls_gitlab_ci.git -b master
    - mkdir build
    # build the project
    - mkdir build
    - cd build
    - cmake ..
    - make -j$(nproc)
  artifacts:
    paths:
      - dls_gitlab_ci/*
      - build/*
      - bin/*
    expire_in: 3 hrs


