# ==============================================================================
# Environment setup
# ==============================================================================
image: server-harbor:80/dls2/dls2-dev:22.04
before_script:
  - source /root/dls_gitlab_ci/gitlab-script.sh
    
# ==============================================================================
# Stages
# ==============================================================================
stages:
  - build
  - test
  - package
  - deploy

# ------------------------------------------------------------------------------
# Build Stage
# ------------------------------------------------------------------------------
build:
  stage: build
  tags:
    - dls
  script:
    - mkdir build
    - cd build
    - cmake ..
    - make -j$(nproc)
    # Make robots libraries visible for test stage
    - cp src/robots/*.so tests/
  artifacts:
    paths:
      - build/*
      - build/tests/*
    expire_in: 3 hrs


test:
  stage: test
  tags: 
    - dls
  script:
    - cd build/tests
    - make -j$(nproc) main_tests
    - ./main_tests
  dependencies:
    - build

package:
  stage: package
  tags:
    - dls
  script:
    - cd build
    - make package
    - echo $CI_JOB_ID > CI_JOB_ID   
  artifacts:
    paths:
      - build/*.deb
      - build/CI_JOB_ID
    expire_in: 3 hrs
  dependencies:
    - build
    - test
  only:
    - master
    - develop_dls2

deploy:
  stage: deploy
  tags:
    - dls
  script:
    - curl http://server-ubuntu18/scripts/make-json.bash --output make-json.bash
    - source make-json.bash token=$DLSUSER_TOKEN project=$CI_PROJECT_ID branch=$CI_COMMIT_BRANCH job=$(cat build/CI_JOB_ID) tag=latest release=$(lsb_release -cs) > out.json
    - 'curl -X post -H "Content-Type: application/json" -d @out.json http://server-ubuntu18:9000/hooks/deploy-apt'
  dependencies:
    - package
  only:
    - master
    - develop_dls2